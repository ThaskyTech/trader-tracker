<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Summa's mark (D-69): three stacked cards in the category colours, on a dark tile so it reads on light and dark tabs. -->
  <rect width="48" height="48" rx="10" fill="#0a0a0a"/>
  <g transform="translate(5 6)">
    <rect x="0.75" y="0.75" width="36.5" height="20.5" rx="4.5" fill="#a78bfa" fill-opacity="0.35" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="0.75" y="7.75" width="36.5" height="20.5" rx="4.5" fill="#0a0a0a"/>
    <rect x="0.75" y="7.75" width="36.5" height="20.5" rx="4.5" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0.75" y="14.75" width="36.5" height="20.5" rx="4.5" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
</svg>
